<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:14px Arial,sans-serif;color:#24332e;margin:0;padding:8px 0}p{margin:6px 0;line-height:1.4}button{padding:9px 14px;background:#fff;border:1px solid #226553;border-radius:6px;color:#226553;cursor:pointer}button:focus-visible{outline:2px solid #226553;outline-offset:2px}</style></head>
<body><p id="status" role="status" aria-live="polite">Your browser will request permission to locate this report.</p><button id="retry" type="button">Retry location</button>
<script>
const statusLine=document.getElementById('status'), retry=document.getElementById('retry');
let started=false, request=0;
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');}
function result(value){send('streamlit:setComponentValue',{value});}
function locate(){
 const id=++request; retry.disabled=true;statusLine.textContent='Getting your current location…';result({status:'pending'});
 const fail=message=>{if(id!==request)return;statusLine.textContent=message;retry.disabled=false;result({status:'error',message});};
 if(!navigator.geolocation){fail('Location is unavailable in this browser. Use the approximate-area option below.');return;}
 navigator.geolocation.getCurrentPosition(position=>{
  if(id!==request)return;
  const c=position.coords;statusLine.textContent=`Location captured · estimated accuracy ${Math.round(c.accuracy)} metres`;retry.disabled=false;
  result({status:'ok',latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,timestamp:position.timestamp});
 },error=>fail(error.code===1?'Location access denied. Allow it in browser settings and retry, or choose the approximate-area option.':'Could not get your location. Retry or choose the approximate-area option.'),{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
retry.addEventListener('click',locate);
window.addEventListener('message',event=>{
 if(event.source!==window.parent || event.data?.type!=='streamlit:render')return;
 send('streamlit:setFrameHeight',{height:120});if(!started){started=true;locate();}
});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:120});
</script></body></html>
